<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d171d">
  <title>Gate Control — Server unavailable</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d171d;color:#edf3f5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,rgba(199,237,69,.1),transparent 22rem),#0d171d}.card{width:min(430px,100%);padding:32px 25px;border:1px solid #2a3c45;border-radius:24px;background:#14232b;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.35)}img{width:82px;height:82px;margin-bottom:16px}small{display:block;color:#c7ed45;font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:7px 0 12px;font-size:1.65rem}p{margin:0 auto 22px;max-width:34ch;color:#a9b7bd;line-height:1.55;font-size:.9rem}button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border:0;border-radius:12px;background:#c7ed45;color:#102831;font-weight:850;font-size:.9rem}#status{margin-top:17px;color:#a9b7bd;font-size:.72rem}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#e8a72f}
  </style>
</head>
<body>
  <main class="card">
    <img src="/gate-icon.svg" alt="Gate Control">
    <small>Turnage Automation</small>
    <h1>App server unavailable</h1>
    <p>Gate Control cannot reach its app server. Check this device's network connection and confirm the server is running, then try again.</p>
    <button type="button" id="retry">Retry connection</button>
    <div id="status"><span class="dot"></span>Waiting for the app server</div>
  </main>
  <script>
    const retry = async () => {
      const status = document.getElementById('status'); status.textContent = 'Checking connection…';
      try { const response = await fetch('/api/health?check=' + Date.now(), { cache: 'no-store' }); if (response.ok) { status.textContent = 'Connected. Opening Gate Control…'; location.replace('/'); return; } } catch {}
      status.innerHTML = '<span class="dot"></span>App server is still unavailable';
    };
    document.getElementById('retry').addEventListener('click', retry);
    setInterval(retry, 10000);
  </script>
</body>
</html>
