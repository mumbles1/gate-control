user root;
worker_processes 1;
pid /tmp/gate-control-nginx.pid;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
  # The combined container runs with all Linux capabilities dropped. Keep
  # nginx's request buffers and proxy cache files in the writable /tmp area
  # instead of Alpine's default /var/lib/nginx paths.
  client_body_temp_path /tmp/gate-control-nginx/client_body;
  proxy_temp_path /tmp/gate-control-nginx/proxy;
  fastcgi_temp_path /tmp/gate-control-nginx/fastcgi;
  uwsgi_temp_path /tmp/gate-control-nginx/uwsgi;
  scgi_temp_path /tmp/gate-control-nginx/scgi;

  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen __GATE_CONTROL_LISTEN_PORT__;
    server_name _;
    client_max_body_size 64m;

    location = /integrated-service-unavailable.html {
      root /app/public;
      add_header Cache-Control "no-store";
    }

    location = /access-control { return 302 /access-control/; }
    location /access-control/ {
      proxy_pass http://127.0.0.1:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /access-control;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect ~^(/.*)$ /access-control$1;
      proxy_cookie_path / /access-control/;
      proxy_buffering off;
      proxy_intercept_errors on;
      error_page 502 503 504 = /integrated-service-unavailable.html;
      sub_filter_once off;
      sub_filter_types text/css application/javascript text/javascript;
      sub_filter '"/' '"/access-control/';
      sub_filter "'/" "'/access-control/";
      sub_filter 'url(/' 'url(/access-control/';
      sub_filter 'url=/' 'url=/access-control/';
    }

    location = /mqtt-explorer { return 302 /mqtt-explorer/; }
    # MQTT Explorer 1.0.x sets Webpack's lazy-chunk public path to the site
    # root. Without this route, /2.bundle.js and /3.bundle.js are answered by
    # Gate Control's application fallback with HTTP 200, producing a
    # ChunkLoadError instead of a visible 404.
    location ~ ^/[^/]+\.bundle\.js$ {
      proxy_pass http://127.0.0.1:4000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
    }
    # The browser build uses Socket.IO's conventional absolute endpoint.
    location /socket.io/ {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
    location /mqtt-explorer/ {
      proxy_pass http://127.0.0.1:4000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /mqtt-explorer;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect ~^(/.*)$ /mqtt-explorer$1;
      proxy_cookie_path / /mqtt-explorer/;
      proxy_buffering off;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
      proxy_intercept_errors on;
      error_page 502 503 504 = /integrated-service-unavailable.html;
      sub_filter_once off;
      sub_filter_types text/css application/javascript text/javascript;
      sub_filter '"/' '"/mqtt-explorer/';
      sub_filter "'/" "'/mqtt-explorer/";
      sub_filter 'url(/' 'url(/mqtt-explorer/';
    }

    location / {
      proxy_pass http://127.0.0.1:3100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
