user root;
worker_processes 1;
pid /tmp/gate-control-nginx.pid;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/gate-control-nginx/client_body;
  proxy_temp_path /tmp/gate-control-nginx/proxy;
  fastcgi_temp_path /tmp/gate-control-nginx/fastcgi;
  uwsgi_temp_path /tmp/gate-control-nginx/uwsgi;
  scgi_temp_path /tmp/gate-control-nginx/scgi;
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $external_scheme { default $scheme; ~*^https$ https; ~*^http$ http; }
  map $http_x_forwarded_host $external_host { default $http_x_forwarded_host; "" $http_host; }

  server {
    listen __GATE_CONTROL_LISTEN_PORT__;
    server_name _;
    client_max_body_size 64m;

    location = /integrated-service-unavailable.html {
      root /app/public;
      add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
      root /app/public;
      default_type application/manifest+json;
      add_header Cache-Control "no-cache" always;
    }

    location = /access-control/mobile-fixes.css {
      alias /app/public/access-control-mobile.css;
      add_header Cache-Control "no-cache";
    }

    location = /access-control { return 302 $external_scheme://$external_host/access-control/; }
    location /access-control/ {
      proxy_pass http://127.0.0.1:__UHPPOTED_HTTP_PORT__/;
      proxy_http_version 1.1;
      proxy_set_header Host $external_host;
      proxy_set_header X-Forwarded-Host $external_host;
      proxy_set_header X-Forwarded-Proto $external_scheme;
      proxy_set_header X-Forwarded-Prefix /access-control;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect ~^https?://[^/]+(/access-control/.*)$ $external_scheme://$external_host$1;
      proxy_redirect ~^https?://[^/]+(/.*)$ $external_scheme://$external_host/access-control$1;
      proxy_redirect ~^(/.*)$ $external_scheme://$external_host/access-control$1;
      proxy_cookie_path / /access-control/;
      proxy_buffering off;
      proxy_intercept_errors on;
      error_page 502 503 504 = /integrated-service-unavailable.html;
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript text/javascript;
      sub_filter '<meta charset="UTF-8">' '<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="&#47;access-control/mobile-fixes.css">';
      sub_filter '"/' '"/access-control/';
      sub_filter "'/" "'/access-control/";
      sub_filter 'url(/' 'url(/access-control/';
      sub_filter 'url=/' 'url=/access-control/';
    }

    location / {
      proxy_pass http://127.0.0.1:__GATE_CONTROL_INTERNAL_PORT__;
      proxy_http_version 1.1;
      proxy_set_header Host $external_host;
      proxy_set_header X-Forwarded-Host $external_host;
      proxy_set_header X-Forwarded-Proto $external_scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
