services:
  gate-control:
    build:
      context: .
    image: gate-control:local
    container_name: gate-control
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: "https://gates.example.com"
      ALERT_DATA_DIR: "/data"
      ACCESS_CONTROL_DATA_DIR: "/data/access-control"
      UHPPOTED_CREDENTIALS_CSV: "/data/access-control/credentials.csv"
      GATE_CONTROL_LISTEN_PORT: "3000"
      GATE_CONTROL_INTERNAL_PORT: "3100"
      UHPPOTED_HTTP_PORT: "8080"
      ALERT_MONITOR_PORT: "3001"
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/data
      - ./access-control-data:/data/access-control
